# # LiveKit Server Production Configuration
# # Used instead of --dev flag for production

# port: 7880

# # RTC configuration for WebRTC
# rtc:
#   tcp_port: 7881
#   port_range_start: 50000
#   port_range_end: 60000
#   # Your public IP — update this if your IP changes (or rely on DDNS)
#   node_ip: ""  # Leave empty to auto-detect, or set to your public IP

# # Disable dev mode
# development: false

# # Keys — MUST match your Backend/.env LIVEKIT_API_KEY and LIVEKIT_API_SECRET
# keys:
#   # Format: api_key: api_secret
#   # Replace these with strong values (keep in sync with deploy/.env.production)
#   gathyr_key: ff6aea8cd6c8f926eb5e7d5a99e1a3fa208e8690e2743d672eeb2b96a0152701

# # Logging
# logging:
#   level: info
#   json: false

# # TURN disabled — using Cloudflare Tunnel for transport.
# # LiveKit will fall back to WebSocket-based media when direct UDP is unavailable.
# turn:
#   enabled: false


port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  interfaces:
    includes:
      - enp0s6
  packet_buffer_size_video: 2000
  # Throttle PLI (keyframe requests) on the high-quality layer.
  # Default high_quality=1s means a keyframe burst can be triggered every second.
  # Each keyframe for 1080p screenshare is ~200-400KB and causes a freeze on delivery.
  # Raising to 4s limits freeze events to at most once every 4 seconds from PLI triggers.
  pli_throttle:
    low_quality: 1s
    mid_quality: 2s
    high_quality: 4s

development: false

keys:
  gathyr_key: ff6aea8cd6c8f926eb5e7d5a99e1a3fa208e8690e2743d672eeb2b96a0152701

logging:
  level: info
  json: false

turn:
  enabled: true
  domain: livekit.gathyr.app
  cert_file: /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/livekit.gathyr.app/livekit.gathyr.app.crt
  key_file: /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/livekit.gathyr.app/livekit.gathyr.app.key
  tls_port: 5349
  udp_port: 3478
  relay_range_start: 30000
  relay_range_end: 40000