# LiveKit production config TEMPLATE.
# Copy to deploy/livekit.yaml (gitignored) on the server and fill in the key.
# The key/secret pair MUST match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in Backend/.env.
# Generate:  echo "gk_$(openssl rand -hex 6)"  and  openssl rand -hex 32

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  interfaces:
    includes:
      - enp0s6
  packet_buffer_size_video: 2000
  pli_throttle:
    low_quality: 500ms
    mid_quality: 1s
    high_quality: 1s

development: false

keys:
  REPLACE_WITH_KEY: REPLACE_WITH_SECRET

logging:
  level: info
  json: false

# TURN lets users behind strict NATs/firewalls connect (TLS on 5349 looks like HTTPS).
# The `ubuntu` user must be able to read Caddy's cert files, e.g.:
#   sudo setfacl -R -m u:ubuntu:rX  <caddy cert dir> ; sudo setfacl -d -m u:ubuntu:rX <caddy cert dir>
turn:
  enabled: true
  domain: livekit.gathyr.app
  cert_file: /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/livekit.gathyr.app/livekit.gathyr.app.crt
  key_file: /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/livekit.gathyr.app/livekit.gathyr.app.key
  tls_port: 5349
  udp_port: 3478
  relay_range_start: 30000
  relay_range_end: 40000
